server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/generated/security-headers.conf;

    # Angular client-side routing: unmatched paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # env.js is generated per-container-start by docker-entrypoint.d/20-envsubst-config.sh —
    # never let it (or the raw index.html) be cached by the browser/CDN.
    location = /assets/env.js {
        include /etc/nginx/generated/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/generated/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|gif|ico)$ {
        include /etc/nginx/generated/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
