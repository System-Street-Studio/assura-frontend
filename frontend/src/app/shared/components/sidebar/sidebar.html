<aside
  class="h-full flex flex-col border-r transition-all duration-300 ease-in-out
         bg-white border-slate-200"
  [class.w-56]="!isCollapsed"
  [class.min-w-56]="!isCollapsed"
  [class.w-16]="isCollapsed"
  [class.min-w-16]="isCollapsed"
>
  <!-- Brand Header -->
  <div
    class="h-14 px-4 flex items-center gap-3 border-b shrink-0 border-slate-200"
  >
    @if (!isCollapsed) {
      <img src="assets/images/LOGO2.png" alt="Assura" class="w-7 h-7 object-contain" />
      <strong class="flex-1 text-indigo-700 text-lg font-extrabold tracking-tight">
        Assura
      </strong>
    }
    <mat-icon
      aria-hidden="true"
      (click)="toggleSidebar()"
      class="cursor-pointer text-slate-500 hover:text-indigo-600 transition-colors duration-200"
      style="outline: none; font-size: 20px; width: 20px; height: 20px;"
    >menu</mat-icon>
  </div>

  <!-- Navigation Links -->
  <nav class="flex-1 flex flex-col gap-2 py-4 overflow-y-auto w-full" aria-label="Main navigation">
    @for (item of filteredMenuItems; track item.link) {
      <div class="w-full px-4 box-border">
        <a
          [routerLink]="item.link"
          routerLinkActive="active-link"
          class="group flex items-center gap-3.5 rounded-xl text-[15px] font-semibold transition-all duration-200
                 text-slate-600 hover:bg-indigo-50 hover:text-indigo-700
                 no-underline w-full"
          [class.px-4]="!isCollapsed"
          [class.py-3]="!isCollapsed"
          [class.justify-center]="isCollapsed"
          [class.px-0]="isCollapsed"
          [class.py-2]="isCollapsed"
        >
          <mat-icon
            aria-hidden="true"
            class="shrink-0 transition-colors duration-200"
            style="font-size: 20px; width: 20px; height: 20px;"
          >{{ item.icon }}</mat-icon>
          @if (!isCollapsed) {
            <span class="whitespace-nowrap truncate">{{ item.label }}</span>
          }
        </a>
      </div>
    }
  </nav>

  <!-- Footer -->
  @if (!isCollapsed) {
    <div class="mt-auto px-4 py-4 text-[11px] leading-relaxed text-slate-400">
      © 2026 Assura. All rights reserved.
    </div>
  }
</aside>
