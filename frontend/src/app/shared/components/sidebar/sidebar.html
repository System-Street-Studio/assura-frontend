<aside
  class="h-full flex flex-col border-r transition-all duration-300 ease-in-out
         bg-slate-50 border-slate-200
         dark:bg-slate-950 dark:border-slate-800"
  [class.w-56]="!isCollapsed"
  [class.min-w-56]="!isCollapsed"
  [class.w-16]="isCollapsed"
  [class.min-w-16]="isCollapsed"
>
  <!-- Brand Header -->
  <div
    class="h-14 px-4 flex items-center gap-3 border-b shrink-0
           border-slate-200 dark:border-slate-800"
  >
    @if (!isCollapsed) {
      <img src="assets/images/LOGO2.png" alt="Assura" class="w-7 h-7 object-contain" />
      <strong class="flex-1 text-indigo-700 dark:text-indigo-400 text-lg font-extrabold tracking-tight">
        Assura
      </strong>
    }
    <mat-icon
      aria-hidden="true"
      (click)="toggleSidebar()"
      class="cursor-pointer text-slate-500 hover:text-indigo-600 dark:text-slate-400 dark:hover:text-indigo-400 transition-colors duration-200"
      style="outline: none; font-size: 20px; width: 20px; height: 20px;"
    >menu</mat-icon>
  </div>

  <!-- Navigation Links -->
  <nav class="flex-1 flex flex-col gap-0.5 pt-3 px-2 overflow-y-auto" aria-label="Main navigation">
    @for (item of filteredMenuItems; track item.link) {
      <a
        [routerLink]="item.link"
        routerLinkActive="active-link"
        class="group flex items-center gap-3 rounded-xl text-sm font-semibold transition-all duration-200
               text-slate-600 hover:bg-indigo-50 hover:text-indigo-700
               dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-indigo-400
               no-underline"
        [class.px-3]="!isCollapsed"
        [class.py-2.5]="!isCollapsed"
        [class.justify-center]="isCollapsed"
        [class.px-0]="isCollapsed"
        [class.py-2]="isCollapsed"
      >
        <mat-icon
          aria-hidden="true"
          class="shrink-0 transition-colors duration-200"
          style="font-size: 20px; width: 20px; height: 20px;"
        >{{ item.icon }}</mat-icon>
        @if (!isCollapsed) {
          <span class="whitespace-nowrap">{{ item.label }}</span>
        }
      </a>
    }
  </nav>

  <!-- Footer -->
  @if (!isCollapsed) {
    <div class="mt-auto px-4 py-4 text-[11px] leading-relaxed text-slate-400 dark:text-slate-600">
      © 2026 Assura. All rights reserved.
    </div>
  }
</aside>
