<aside
  class="h-full flex flex-col border-r transition-all duration-300 ease-in-out
         bg-white border-slate-200"
  [class.w-56]="!isCollapsed"
  [class.min-w-56]="!isCollapsed"
  [class.w-16]="isCollapsed"
  [class.min-w-16]="isCollapsed"
>
  <!-- Brand Header -->
  <div class="sidebar-brand-header">
    @if (!isCollapsed) {
      <img src="assets/images/LOGO2.png" alt="Assura" class="sidebar-brand-logo" />
      <strong class="sidebar-brand-text">Assura</strong>
    }
    <div class="sidebar-toggle-btn" (click)="toggleSidebar()">
      <mat-icon
        aria-hidden="true"
        style="outline: none; font-size: 20px; width: 20px; height: 20px;"
      >menu</mat-icon>
    </div>
  </div>

  <!-- Navigation Links -->
  <nav class="flex-1 flex flex-col sidebar-nav-container overflow-y-auto w-full" aria-label="Main navigation">
    @for (item of filteredMenuItems; track item.link) {
      <div class="sidebar-nav-item-wrapper">
        <a
          [routerLink]="item.link"
          routerLinkActive="active-link"
          class="sidebar-nav-link group flex items-center rounded-xl font-semibold transition-all duration-200
                 text-slate-600 hover:bg-indigo-50 hover:text-indigo-700
                 no-underline w-full"
          [class.active-collapse-padding]="isCollapsed"
        >
          <mat-icon
            aria-hidden="true"
            class="sidebar-nav-icon shrink-0 transition-colors duration-200"
          >{{ item.icon }}</mat-icon>
          @if (!isCollapsed) {
            <span class="whitespace-nowrap truncate">{{ item.label }}</span>
          }
        </a>
      </div>
    }
  </nav>

  <!-- Footer -->
  @if (!isCollapsed) {
    <div class="mt-auto px-4 py-4 text-[11px] leading-relaxed text-slate-400">
      © 2026 Assura. All rights reserved.
    </div>
  }
</aside>
