<aside class="shared-sidebar">
  <div class="sidebar-brand">
    <img src="assets/images/LOGO2.png" alt="Assura" />
    <strong>Assura</strong>
    <mat-icon aria-hidden="true">menu</mat-icon>
  </div>

  <nav class="sidebar-nav" aria-label="Main navigation">
    @for (item of filteredMenuItems; track item.link) {
      <a class="sidebar-link" [routerLink]="item.link" routerLinkActive="active">
        <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-footer">© 2026 Assura. All rights reserved.</div>
</aside>
