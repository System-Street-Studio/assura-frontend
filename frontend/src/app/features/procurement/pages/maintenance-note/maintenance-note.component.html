<div style="padding: 32px; max-width: 800px; margin: 0 auto; height: 100%; overflow-y: auto;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <div>
            <h1 class="assura-page-title" style="margin-bottom: 4px;">Maintenance Note</h1>
            <span style="color: #64748b; font-size: 14px;">View and update maintenance status</span>
        </div>
    </div>

    <div class="assura-card" style="padding: 32px;" *ngIf="noteData; else loading">
        <div class="assura-grid assura-grid-cols-2" style="gap: 24px; margin-bottom: 24px;">
            <div>
                <label class="assura-label">Asset</label>
                <div style="font-weight: 500; color: #0f172a; padding: 8px 12px; background: #f8fafc; border-radius: 6px; border: 1px solid #e2e8f0;">{{ noteData.assetName }}</div>
            </div>
            <div>
                <label class="assura-label">Date</label>
                <div style="font-weight: 500; color: #0f172a; padding: 8px 12px; background: #f8fafc; border-radius: 6px; border: 1px solid #e2e8f0;">{{ noteData.maintenanceDate | date:'mediumDate' }}</div>
            </div>
            <div>
                <label class="assura-label">Repair Firm</label>
                <div style="font-weight: 500; color: #0f172a; padding: 8px 12px; background: #f8fafc; border-radius: 6px; border: 1px solid #e2e8f0;">{{ noteData.repairingFirmName || 'N/A' }}</div>
            </div>
            <div>
                <label class="assura-label">Cost (LKR)</label>
                <div style="font-weight: 500; color: #0f172a; padding: 8px 12px; background: #f8fafc; border-radius: 6px; border: 1px solid #e2e8f0;">{{ noteData.cost }}</div>
            </div>
            <div style="grid-column: span 2;">
                <label class="assura-label">Status</label>
                <select [(ngModel)]="editStatus" class="assura-input custom-select">
                    <option value="Scheduled">Scheduled</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>
            <div style="grid-column: span 2;">
                <label class="assura-label">Description</label>
                <div style="padding: 16px; background: #f8fafc; border-radius: 6px; border: 1px solid #e2e8f0; color: #475569; line-height: 1.5; min-height: 80px;">
                    {{ noteData.description || 'No description provided.' }}
                </div>
            </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 32px; padding-top: 24px; border-top: 1px solid #e2e8f0;">
            <button class="assura-btn assura-btn-secondary" (click)="close()">Close</button>
            <button class="assura-btn assura-btn-primary" (click)="updateStatus()" [disabled]="isUpdating || noteData.status === editStatus">
                <mat-icon style="font-size: 18px;" *ngIf="!isUpdating">save</mat-icon>
                <mat-icon style="font-size: 18px; animation: spin 1s linear infinite;" *ngIf="isUpdating">sync</mat-icon>
                {{ isUpdating ? 'Saving...' : 'Save Changes' }}
            </button>
        </div>
    </div>
    
    <ng-template #loading>
        <div class="assura-card" style="padding: 48px; text-align: center; color: #64748b;">
            <mat-icon style="font-size: 32px; width: 32px; height: 32px; margin-bottom: 16px; animation: spin 1s linear infinite;">sync</mat-icon>
            <div>Loading maintenance note details...</div>
        </div>
    </ng-template>
</div>
