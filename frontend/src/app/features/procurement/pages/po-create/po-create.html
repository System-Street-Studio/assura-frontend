<div class="po-create-container">
    <div class="popup-overlay" *ngIf="showSuccessPopup">
        <app-status-card label="Saved" icon="check_box" color="#00AFB5"></app-status-card>
    </div>
    <h1 class="page-title">Add New Purchasing Order</h1>

    <div class="form-card">
        <h2 class="item-title">Add Item No {{ itemCount | number:'2.0' }}</h2>

        <div class="form-grid">
            <!-- Row 1 -->
            <div class="form-group full-width">
                <label>Item Name:</label>
                <input type="text" class="form-control" [(ngModel)]="itemName">
            </div>

            <!-- Row 2 -->
            <div class="form-group full-width">
                <label>Model:</label>
                <input type="text" class="form-control" [(ngModel)]="model">
            </div>

            <!-- Row 3: Warranty -->
            <div class="form-group full-width warranty-group">
                <label>Warranty:</label>
                <div class="warranty-controls">
                    <input type="number" class="form-control short-input warranty-input" [(ngModel)]="warrantyDuration">
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" [(ngModel)]="warrantyYears"> Years
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" [(ngModel)]="warrantyMonths"> Months
                        </label>
                    </div>
                </div>
            </div>

            <!-- Row 4 -->
            <div class="form-group">
                <label>Quantity:</label>
                <input type="number" class="form-control short-input" [(ngModel)]="quantity">
            </div>
            <div class="form-group">
                <!-- Spacer -->
            </div>

            <!-- Row 5 -->
            <div class="form-group">
                <label>Unit Price (LKR):</label>
                <input type="number" class="form-control medium-input" [(ngModel)]="unitPrice">
            </div>
            <div class="form-group">
                <!-- Spacer -->
            </div>

            <!-- Row 6 -->
            <div class="form-group">
                <label>Amount (LKR):</label>
                <input type="number" class="form-control medium-input" [(ngModel)]="amount">
            </div>
            <div class="form-group">
                <!-- Spacer -->
            </div>

            <!-- Row 7 -->
            <div class="form-group">
                <label>Discount:</label>
                <input type="number" class="form-control short-input" [(ngModel)]="discount">
            </div>
            <div class="form-group right-align">
                <label>Discounted Price (LKR):</label>
                <input type="number" class="form-control medium-input" [(ngModel)]="discountedPrice">
            </div>

            <!-- Row 8 -->
            <div class="form-group">
                <label>VAT:</label>
                <input type="number" class="form-control short-input" [(ngModel)]="vat">
            </div>
            <div class="form-group right-align">
                <label>VAT (LKR):</label>
                <input type="number" class="form-control medium-input" [(ngModel)]="vatAmount">
            </div>

            <!-- Total Price -->
            <div class="form-group full-width total-price-row">
                <label>Total Price (LKR):</label>
                <input type="number" class="form-control medium-input" [(ngModel)]="totalPrice">
            </div>
        </div>

        <!-- Special Note -->
        <div class="form-group full-width">
            <label>Special Note:</label>
            <textarea class="form-control note-area" [(ngModel)]="specialNote"></textarea>
        </div>

        <!-- Buttons -->
        <div class="button-row">
            <div class="btn-left">
                <app-button label="Cancel" color="red" (clicked)="exit()"></app-button>
            </div>
            <div class="btn-center">
                <app-button label="Save and Next" color="teal" (clicked)="onSaveAndNext()"></app-button>
            </div>
            <div class="btn-right">
                <app-button label="Save & Exit" color="red" (clicked)="exit()"></app-button>
            </div>
        </div>
    </div>
</div>
