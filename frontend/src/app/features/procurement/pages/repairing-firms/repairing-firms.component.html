<div style="padding: 32px; max-width: 1200px; margin: 0 auto; height: 100%; overflow-y: auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <div style="display: flex; align-items: center; gap: 16px;">
            <button class="assura-btn assura-btn-secondary" style="padding: 8px;" (click)="goBack()">
                <i class="material-icons" style="font-size: 20px;">arrow_back</i>
            </button>
            <h1 class="assura-page-title" style="margin-bottom: 0;">Repairing Firms</h1>
        </div>
        <div style="display: flex; align-items: center; gap: 16px;">
            <app-search-bar (queryChange)="onSearch($event)" placeholder="Search Firms..."></app-search-bar>
            <button class="assura-btn assura-btn-primary" (click)="navigateToCreate()">
                <i class="material-icons" style="font-size: 18px;">add</i> Add New Firm
            </button>
        </div>
    </div>

    <!-- Hidden debug info -->
    <!-- <div style="font-size: 10px; color: gray;">[DEBUG] isLoading: {{ isLoading }}, pagedFirms.length: {{ pagedFirms.length }}</div> -->

    <div class="assura-table-container">
        <table class="assura-table">
            <thead>
                <tr>
                    <th class="assura-th">Name</th>
                    <th class="assura-th">Contact Person</th>
                    <th class="assura-th">Email</th>
                    <th class="assura-th">Phone</th>
                    <th class="assura-th">Address</th>
                    <th class="assura-th" style="width: 80px; text-align: center;">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngIf="isLoading">
                    <td colspan="6" class="assura-td" style="text-align: center; color: #64748b; padding: 32px;">
                        Loading firms...
                    </td>
                </tr>
                <tr *ngIf="!isLoading && pagedFirms.length === 0">
                    <td colspan="6" class="assura-td" style="text-align: center; color: #94a3b8; padding: 32px;">
                        No repairing firms found.
                    </td>
                </tr>
                <tr class="assura-tr-hover" *ngFor="let firm of pagedFirms">
                    <td class="assura-td" style="font-weight: 600; color: #0f172a;">{{ firm.name }}</td>
                    <td class="assura-td" style="color: #475569;">{{ firm.contactPerson || '-' }}</td>
                    <td class="assura-td" style="color: #64748b;">{{ firm.email || '-' }}</td>
                    <td class="assura-td" style="color: #64748b;">{{ firm.phone || '-' }}</td>
                    <td class="assura-td" style="color: #64748b;">{{ firm.address || '-' }}</td>
                    <td class="assura-td" style="text-align: center;">
                        <button class="assura-btn assura-btn-secondary" style="padding: 4px 8px;" (click)="editFirm(firm.id)">
                            <i class="material-icons" style="font-size: 18px; color: #4f46e5;">edit</i>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>

        <div style="padding: 16px 24px; border-top: 1px solid #e2e8f0;" *ngIf="pagedFirms.length > 0">
            <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" [pageNumbers]="pageNumbers"
                (pageChange)="goToPage($event)">
            </app-pagination>
        </div>
    </div>
</div>
