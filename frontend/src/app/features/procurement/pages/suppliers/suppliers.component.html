<div class="suppliers-container">

    <div class="page-header">
        <h1 class="page-title">Suppliers</h1>
        <div class="header-actions">
            <div class="search-bar">
                <mat-icon class="search-icon">search</mat-icon>
                <input type="text" placeholder="Search Assets..." class="search-input" [(ngModel)]="searchQuery"
                    (ngModelChange)="onSearch()" />
            </div>
            <button class="add-new-btn" (click)="onAddNew()">Add New</button>
        </div>
    </div>

    <div class="table-container">
        <table class="suppliers-table">
            <thead>
                <tr>
                    <th>Supplier ID</th>
                    <th>Name</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let supplier of pagedSuppliers">
                    <td (click)="navigateToDetails(supplier.id)" style="cursor: pointer;">{{ supplier.id }}</td>
                    <td>{{ supplier.name }}</td>
                </tr>
                <tr *ngIf="pagedSuppliers.length === 0">
                    <td colspan="2" class="no-results">No suppliers found.</td>
                </tr>
            </tbody>
        </table>

        <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" [pageNumbers]="pageNumbers"
            (pageChange)="goToPage($event)">
        </app-pagination>
    </div>

</div>
