<div class="page-container" [class.blurred]="showSuccess">
    <h1 class="page-title">Inform New Arrivals</h1>

    <div class="form-card">
        <h2 class="form-title">Inform New Assets has arrived</h2>

        <form class="arrival-form" [formGroup]="arrivalForm" (ngSubmit)="onSubmit()">
            <!-- Item Name -->
            <div class="form-group full-width">
                <label for="itemName">Item Name:</label>
                <input type="text" id="itemName" formControlName="itemName" placeholder="">
            </div>

            <!-- Model -->
            <div class="form-group full-width">
                <label for="model">Model:</label>
                <input type="text" id="model" formControlName="model">
            </div>

            <!-- Warranty -->
            <div class="form-group inline-group">
                <label for="warranty">Warranty:</label>
                <div class="warranty-input-group">
                    <input type="number" id="warranty" formControlName="warranty">
                    <div class="checkbox-group">
                        <label class="checkbox-container">
                            <input type="checkbox" formControlName="isYears">
                            <span class="checkmark"></span>
                            Years
                        </label>
                        <label class="checkbox-container">
                            <input type="checkbox" formControlName="isMonths">
                            <span class="checkmark"></span>
                            Months
                        </label>
                    </div>
                </div>
            </div>

            <!-- Quantity -->
            <div class="form-group small-width">
                <label for="quantity">Quantity:</label>
                <input type="number" id="quantity" formControlName="quantity">
            </div>

            <!-- Purchased Date & Division -->
            <div class="row">
                <div class="form-group half-width">
                    <label for="purchasedDate">Purchased Date</label>
                    <div class="date-input-wrapper">
                        <input type="date" id="purchasedDate" formControlName="purchasedDate">
                    </div>
                </div>
                <div class="form-group half-width">
                    <label for="divisionId">Division</label>
                    <select id="divisionId" formControlName="divisionId" class="custom-select">
                        <option [ngValue]="null">Select Division</option>
                        <option *ngFor="let division of divisions" [value]="division.id">{{ division.name }}</option>
                    </select>
                </div>
            </div>

            <!-- Purchased Price -->
            <div class="form-group half-width">
                <label for="purchasedPrice">Purchased Price (LKR)</label>
                <input type="number" id="purchasedPrice" formControlName="purchasedPrice">
            </div>

            <!-- Buttons -->
            <div class="button-group">
                <button type="button" class="btn btn-cancel" (click)="onCancel()"
                    [disabled]="isSubmitting">Cancel</button>
                <button type="submit" class="btn btn-inform" [disabled]="!arrivalForm.valid || isSubmitting">{{
                    isSubmitting ? 'Informing...' : 'Inform' }}</button>
            </div>
        </form>
    </div>

    <!-- History Section -->
    <div class="history-card">
        <h2 class="form-title">Recent New Arrivals</h2>
        <div class="table-wrapper">
            <table class="history-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Item Name</th>
                        <th>Model</th>
                        <th>Qty</th>
                        <th>Division</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of history">
                        <td>{{ item.purchasedDate | date:'mediumDate' }}</td>
                        <td>{{ item.itemName }}</td>
                        <td>{{ item.model || '-' }}</td>
                        <td>{{ item.quantity }}</td>
                        <td>{{ item.divisionName }}</td>
                        <td>
                            <span class="status-badge" [class.pending]="item.status === 'Pending'">
                                {{ item.status }}
                            </span>
                        </td>
                    </tr>
                    <tr *ngIf="history.length === 0">
                        <td colspan="6" class="no-data">No history found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Success Overlay -->
    <div class="success-overlay" *ngIf="showSuccess">
        <app-status-card label="Informed Stores Successfully" icon="check_box" color="#00AFB5">
        </app-status-card>
    </div>
</div>
