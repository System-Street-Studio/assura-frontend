<div class="note-page-container">
    <div class="popup-overlay" *ngIf="showSuccessPopup">
        <app-status-card label="Added New Maintenance Note Successfully" icon="check_box"
            color="#00AFB5"></app-status-card>
    </div>
    <h1 class="page-title">Add New Note</h1>

    <div class="note-card">
        <form (ngSubmit)="save()" #noteForm="ngForm">
            <div class="note-grid">
                <div class="note-item">
                    <label for="maintenanceNumber">Maintenance No:</label>
                    <input type="text" id="maintenanceNumber" name="maintenanceNumber"
                        [(ngModel)]="noteData.maintenanceNumber" readonly>
                </div>
                <div class="note-item">
                    <label for="asset">Asset:</label>
                    <select id="asset" name="asset" [(ngModel)]="noteData.assetId" required>
                        <option [ngValue]="null">Select Asset</option>
                        <option *ngFor="let asset of assets" [ngValue]="asset.id">{{ asset.assetCode }} - {{
                            asset.assetName }}</option>
                    </select>
                </div>
                <div class="note-item">
                    <label for="date">Date:</label>
                    <input type="date" id="date" name="date" [(ngModel)]="noteData.date" required>
                </div>
                <div class="note-item">
                    <label for="repairFirm">Repair Firm:</label>
                    <select id="repairFirm" name="repairFirm" [(ngModel)]="noteData.repairingFirmId">
                        <option [ngValue]="null">Select Repair Firm</option>
                        <option *ngFor="let firm of repairingFirms" [ngValue]="firm.id">{{ firm.name }}</option>
                    </select>
                </div>
                <div class="note-item">
                    <label for="status">Status:</label>
                    <select id="status" name="status" [(ngModel)]="noteData.status">
                        <option value="Scheduled">Scheduled</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
                <div class="note-item">
                    <label for="cost">Cost (LKR):</label>
                    <input type="number" id="cost" name="cost" [(ngModel)]="noteData.cost" required>
                </div>
                <div class="note-item full-width">
                    <label for="description">Description:</label>
                    <textarea id="description" name="description" [(ngModel)]="noteData.description"
                        required></textarea>
                </div>
            </div>

            <div class="action-row">
                <button type="button" class="action-btn close-btn" (click)="close()">Close</button>
                <button type="submit" class="action-btn save-btn" [disabled]="!noteForm.form.valid">Save & Exit</button>
            </div>
        </form>
    </div>
</div>
