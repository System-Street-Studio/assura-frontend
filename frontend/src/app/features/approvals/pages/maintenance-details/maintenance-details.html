<div class="container">
    <div class="header-section">
      <div class ="page-title">Requests</div>      
    </div>
    
  <div class="modal-overlay">
  <div class="modal-container">
    <div class="modal-header">
      <h2>Maintenance Request Details</h2>
      <button class="close-btn" (click)="close()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="details-grid">
      <div class="column">
        <div class="info-group">
          <label>Asset Name</label>
          <p class="bold-text">{{ request().assetName }}</p>
        </div>

        <div class="info-group">
          <label>Asset Category</label>
          <p class="bold-text">{{ request().category }}</p>
        </div>

        <div class="info-group">
          <label>Priority</label>
          <p class="bold-text" [style.color]="request().priority === 'High' ? 'red' : 'inherit'">{{ request().priority }}</p>
        </div>
      </div>

      <div class="column">
        <div class="info-group">
          <label>Employee Name</label>
          <p class="bold-text">{{ request().name }}</p>
        </div>

        <div class="info-group">
          <label>Employee ID</label>
          <p class="bold-text">{{ request().employee }}</p>
        </div>

        <div class="info-group">
          <label>Submitted Date</label>
          <p class="bold-text">{{ request().date | date:'yyyy-MM-dd' }}</p>
        </div>
      </div>

      <div class="info-group full-width">
        <label>Issue Details</label>
        <p class="description-text">{{ request().specs }}</p>
      </div>

      <div class="info-group">
        <label>Status</label>
        <span class="status-badge" [ngClass]="request().status.toLowerCase()">{{ request().status }}</span>
      </div>
      
    </div>

    <div class="action-buttons">
      <button class="btn-approve" (click)="approveRequest()">
        <mat-icon>check_circle</mat-icon> Approve Request
      </button>
      <button class="btn-reject" (click)="rejectRequest()">
        <mat-icon>close</mat-icon> Reject with Reason
      </button>
    </div>
  </div>
  </div>
</div>
