<div class="container">
<div class="header-section">
      <div class ="page-title">Requests</div>      
    </div>
    
    <div class="modal-overlay">
  <div class="modal-container">
    <div class="modal-header">
      <h2>Discard Request Details</h2>
      <button class="close-btn" (click)="close()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="details-grid">
      <!-- Line 1: Asset Name | Asset Category -->
      <div class="info-group">
        <label>Asset Name</label>
        <p class="bold-text">{{ request().assetName }}</p>
      </div>

      <div class="info-group">
        <label>Asset Category</label>
        <p class="bold-text">{{ request().category }}</p>
      </div>

      <!-- Line 2: Employee Name | Employee ID -->
      <div class="info-group">
        <label>Employee Name</label>
        <p class="bold-text">{{ request().name }}</p>
      </div>

      <div class="info-group">
        <label>Employee ID</label>
        <p class="bold-text">{{ request().employee }}</p>
      </div>

      <!-- Line 3: Submitted Date & Time | Priority -->
      <div class="info-group">
        <label>Submitted Date & Time</label>
        <p class="bold-text">{{ request().date | date:'medium' }}</p>
      </div>

      <div class="info-group">
        <label>Priority</label>
        <p class="bold-text" [ngClass]="'priority-' + request().priority.toLowerCase()">{{ request().priority }}</p>
      </div>

      <!-- Full Width: Additional Details -->
      <div class="info-group full-width">
        <label>Additional Details</label>
        <p class="bold-text">{{ request().specs }}</p>
      </div>

      <!-- Full Width: Reason for Discarding -->
      <div class="info-group full-width">
        <label>Reason for Discarding</label>
        <p class="bold-text">{{ request().justification }}</p>
      </div>

      <!-- Full Width: Status -->
      <div class="info-group full-width">
        <label>Status</label>
        <span class="status-badge" [ngClass]="request().status.toLowerCase()">{{ request().status }}</span>
      </div>
    </div>

    <hr />

    <div class="action-buttons">
      <button class="btn-approve" (click)="approveRequest()">
        <mat-icon>delete_forever</mat-icon> Confirm Discard
      </button>
      <button class="btn-reject" (click)="rejectRequest()">
        <mat-icon>close</mat-icon> Reject Request
      </button>
    </div>
  </div>
</div>
</div>
