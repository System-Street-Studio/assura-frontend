<div class="modal-overlay">
  <div class="modal-container">
    <div class="modal-header">
      <h2>Discard Request Details</h2>
      <button class="close-btn" (click)="close()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="details-grid">
      <div class="info-group">
        <label>Asset</label>
        <p class="bold-text">{{ request().asset }}</p>
      </div>

      <div class="info-group">
        <label>Employee Name</label>
        <p class="bold-text">{{ request().name }}</p>
      </div>

      <div class="info-group">
        <label>Asset Category</label>
        <p class="bold-text">{{ request().category }}</p>
      </div>

      <div class="info-group">
        <label>Submitted Date</label>
        <p class="bold-text">{{ request().submittedDate }}</p>
      </div>

      <div class="info-group full-width">
        <label>Reason for Discarding</label>
        <p class="reason-text">{{ request().reason }}</p>
      </div>

      <div class="info-group full-width">
        <label>Description / Condition</label>
        <p class="description-text">{{ request().description }}</p>
      </div>

      <div class="info-group full-width temporary-notice">
        <mat-icon>info</mat-icon>
        <p>Instead, need an asset for temporary use: <strong>{{ request().needTemporary }}</strong></p>
      </div>
    </div>

    <div class="action-buttons">
      <button class="btn-approve" (click)="approveRequest()">
        <mat-icon>delete_forever</mat-icon> Confirm Discard
      </button>
      <button class="btn-reject" (click)="rejectRequest()">
        <mat-icon>close</mat-icon> Reject Request
      </button>
    </div>
  </div>
</div>
