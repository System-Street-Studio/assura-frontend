<div class="main-content">
<!-- Back link and page header -->
  <div class="content-padding">
    <h1 class="section-label">Requests </h1>
    <a routerLink="/employee/requests-main" class="back-link">←</a>
    <h2 class="page-title">New Asset Requests</h2>

    <!--form card-->
    <div class="form-card">
      <div class="form-header">
        <h3>Asset Request Details</h3>
        <p>Please fill out the form below to submit your asset request.</p>
      </div>

      <!--select asset category-->
      <form (ngSubmit)="onSubmit()" class="asset-form">
        <div class="form-group">
          <label>Asset Category</label>
          <select [(ngModel)]="requestData.assetCategory" name="assetCategory" class="form-control">
            <option value="" disabled selected>Select an asset category</option>
            <option value="electronics">Electronics</option>
            <option value="furniture">Furniture</option>
            <option value="vehicles">Vehicles</option>
            <option value="other">Other</option>

          </select>
        </div>

          <!--asset name-->
        <div class="form-group">
         
          <label>Asset Name</label>
          <input [(ngModel)]="requestData.assetName" name="assetName" required 
                 placeholder="e.g., Dell XPS 15" class="form-control">
            
        </div>

          <!--description-->
        <div class="form-group">
       
          <label>Description</label>
          <textarea [(ngModel)]="requestData.description" name="description" 
                    placeholder="Clearly state what the specifications of asset you request." 
                    class="form-control" rows="3"></textarea>
         
        </div>

        <!--quantity-->
        <div class="form-group">
         
          <label>Quantity</label>
          <input [(ngModel)]="requestData.quantity" name="quantity" class="form-control">
        
        </div>

        <!--priority-->
        <div class="form-group">
       
          <label>Priority</label>
          <select [(ngModel)]="requestData.priority" name="priority" class="form-control">
            <option value="Normal">Normal</option>
            <option value="High">High</option>
            <option value="Critical">Critical</option>
          </select>
       
        </div>

          <!--reason/justification-->
        <div class="form-group">
      
          <label>Reason/ Justification</label>
          <textarea  [(ngModel)]="requestData.reason" name="reason" 
                    placeholder="Clearly state why this asset is needed for your work." 
                    class="form-control" rows="3"></textarea>
     
        </div>

        <!--attachment-->
        <div class="form-group">
 
          <label>Attachment (Optional)</label>
          <div class="upload-area">
            <mat-icon class="upload-icon">cloud_upload</mat-icon>
            <p>Drag files here or <span class="browse">click to browse</span></p>
          </div>
      
        </div>

        <!--submit button-->
        <button type="submit" class="submit-btn">Submit Request</button>
      </form>
    </div>
  </div>
</div>
