<div style="padding: 32px; max-width: 1200px; margin: 0 auto; height: 100%; overflow-y: auto;">
    <!-- Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <div>
            <h1 class="assura-page-title" style="margin-bottom: 4px;">Products</h1>
            <span class="assura-card-subtitle" style="font-size: 14px;">{{ filteredProducts.length }} of {{ allProducts.length }} products</span>
        </div>
        <div style="display: flex; gap: 12px;">
            <button class="assura-btn assura-btn-secondary" title="Export to CSV">
                <i class="material-icons" style="font-size: 18px;">file_download</i>
                Export
            </button>
            <button class="assura-btn assura-btn-primary" [routerLink]="['/inventory/products/new']" type="button">
                <i class="material-icons" style="font-size: 18px;">add</i>
                New Product
            </button>
        </div>
    </div>

    <!-- Toolbar -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <div style="display: flex; gap: 16px; align-items: center;">
            <div style="position: relative; width: 400px;">
                <mat-icon style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 20px;">search</mat-icon>
                <input type="text" class="assura-input" style="padding-left: 40px; padding-right: 40px;" placeholder="Search by name, ID, manufacturer, model..." [(ngModel)]="search" (input)="applyFilters()" />
                <button *ngIf="search" (click)="search = ''; applyFilters()" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94a3b8; cursor: pointer; display: flex;">
                    <mat-icon style="font-size: 18px;">close</mat-icon>
                </button>
            </div>

            <button class="assura-btn assura-btn-secondary" style="border: none; background: transparent; box-shadow: none;" *ngIf="search" (click)="clearFilters()">
                <i class="material-icons" style="font-size: 18px;">filter_list_off</i> Clear
            </button>
        </div>

        <div>
            <button class="assura-btn assura-btn-secondary" style="color: #ef4444; border-color: #fca5a5;" [disabled]="selectedCount === 0" title="Delete selected">
                <i class="material-icons" style="font-size: 18px;">delete_outline</i>
                Delete
            </button>
        </div>
    </div>

    <!-- Table -->
    <div class="assura-table-container">
        <table class="assura-table">
            <thead>
                <tr>
                    <th class="assura-th" style="width: 40px; text-align: center;">
                        <input type="checkbox" [checked]="allSelected" (change)="toggleSelectAll($event)" />
                    </th>
                    <th class="assura-th">Product ID</th>
                    <th class="assura-th">Name</th>
                    <th class="assura-th">Manufacturer</th>
                    <th class="assura-th">Model</th>
                    <th class="assura-th">Description</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let product of viewProducts" class="assura-tr-hover" style="cursor: pointer;" [class.assura-row-selected]="product.selected" (click)="onRowClick(product)">
                    <td class="assura-td" style="text-align: center;" (click)="$event.stopPropagation()">
                        <input type="checkbox" [checked]="product.selected" (change)="onRowSelect(product, $event)" />
                    </td>
                    <td class="assura-td" style="font-weight: 600; color: #4f46e5;">{{ product.id }}</td>
                    <td class="assura-td" style="font-weight: 500;">{{ product.name }}</td>
                    <td class="assura-td"><span class="assura-card-subtitle" style="margin:0; font-size: 15px;">{{ product.manufacturer || '—' }}</span></td>
                    <td class="assura-td"><span class="assura-card-subtitle" style="margin:0; font-size: 15px;">{{ product.modelNumber || '—' }}</span></td>
                    <td class="assura-td"><span class="assura-card-subtitle" style="margin:0; font-size: 15px;">{{ product.description || '—' }}</span></td>
                </tr>
                <tr *ngIf="viewProducts.length === 0 && !loading">
                    <td colspan="6" class="assura-td" style="text-align: center; padding: 48px;">
                        <mat-icon style="font-size: 48px; width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.5;">inventory_2</mat-icon>
                        <div class="assura-card-subtitle" style="font-size: 16px; font-weight: 500;">No products found</div>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- Pagination -->
        <div *ngIf="filteredProducts.length > 0" style="padding: 16px 24px; border-top: 1px solid #e2e8f0;">
            <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" [pageNumbers]="pageNumbers" (pageChange)="setPage($event)">
            </app-pagination>
        </div>
    </div>
</div>
