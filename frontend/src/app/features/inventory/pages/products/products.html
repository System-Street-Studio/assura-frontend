<div class="page">
  <!-- Header -->
  <div class="page-header">
    <div class="header-left">
      <h1 class="page-title">Products</h1>
      <span class="item-count">{{ filteredProducts.length }} of {{ allProducts.length }} products</span>
    </div>
    <div class="header-actions">
      <button class="btn outline" title="Export to CSV">
        <mat-icon class="btn-icon">file_download</mat-icon>
        Export
      </button>
      <button class="btn primary" (click)="onNewProduct()">
        <mat-icon class="btn-icon">add</mat-icon>
        New Product
      </button>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="search-box">
        <mat-icon class="search-icon">search</mat-icon>
        <input class="search-input" placeholder="Search by name, ID, manufacturer, model..." [(ngModel)]="search"
          (input)="applyFilters()" />
        <button class="search-clear" *ngIf="search" (click)="search = ''; applyFilters()">
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <button class="btn-text" *ngIf="search" (click)="clearFilters()">
        <mat-icon>filter_list_off</mat-icon> Clear
      </button>
    </div>

    <div class="toolbar-right">
      <button class="btn outline sm" [disabled]="selectedCount === 0" title="Delete selected">
        <mat-icon class="btn-icon">delete_outline</mat-icon>
        Delete
      </button>
    </div>
  </div>

  <!-- Table -->
  <div class="table-container">
    <table class="products-table">
      <thead>
        <tr>
          <th class="col-check">
            <input type="checkbox" [checked]="allSelected" (change)="toggleSelectAll($event)" />
          </th>
          <th>Product ID</th>
          <th>Name</th>
          <th>Manufacturer</th>
          <th>Model</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of viewProducts" [class.row-selected]="product.selected" class="clickable-row"
          (click)="onRowClick(product)">
          <td class="col-check" (click)="$event.stopPropagation()">
            <input type="checkbox" [checked]="product.selected" (change)="onRowSelect(product, $event)" />
          </td>
          <td class="cell-id">{{ product.id }}</td>
          <td>{{ product.name }}</td>
          <td>{{ product.manufacturer || '—' }}</td>
          <td>{{ product.modelNumber || '—' }}</td>
          <td>{{ product.description || '—' }}</td>
        </tr>
        <tr *ngIf="viewProducts.length === 0 && !loading">
          <td colspan="6" class="empty-state">
            <mat-icon class="empty-icon">inventory_2</mat-icon>
            <div class="empty-text">No products found</div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <app-pagination *ngIf="filteredProducts.length > 0" [currentPage]="currentPage" [totalPages]="totalPages"
    [pageNumbers]="pageNumbers" (pageChange)="setPage($event)">
  </app-pagination>
</div>
