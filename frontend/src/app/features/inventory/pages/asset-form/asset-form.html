<div style="padding: 32px; max-width: 1200px; margin: 0 auto; height: 100%; overflow-y: auto;">
  <!-- Top bar: back button + breadcrumb. onCancel() uses Location.back() (no save) -->
  <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 24px;">
    <button class="assura-btn assura-btn-secondary" style="padding: 8px;" (click)="onCancel()">
      <mat-icon style="font-size: 20px;">arrow_back</mat-icon>
    </button>
    <!-- pageTitle is a computed getter: 'New Asset' | 'Edit Asset' | 'Clone Asset' -->
    <div>
      <span style="font-size: 13px;  font-weight: 500; text-transform: uppercase;">Assets / {{ pageTitle }}</span>
      <div style="display: flex; align-items: center; gap: 12px; margin-top: 4px;">
        <h1 class="assura-page-title" style="margin-bottom: 0;">{{ pageTitle }}</h1>
        <!-- Badge only appears once the user has typed an asset code -->
        <span class="assura-badge assura-badge-info" style="display: inline-flex; align-items: center; gap: 4px;" *ngIf="assetCodeValue">
          <mat-icon style="font-size: 14px; width: 14px; height: 14px;">tag</mat-icon>
          {{ assetCodeValue }}
        </span>
      </div>
    </div>
  </div>

  <!-- Main reactive form.
       [formGroup] binds to the `assetForm` FormGroup defined in the component.
       (ngSubmit) triggers onSave() which validates then calls the appropriate API. -->
  <form class="assura-card assura-accent-primary" style="padding: 24px;" [formGroup]="assetForm" (ngSubmit)="onSave()">

    <!-- Two-column grid: left = Basic Info, right = Details -->
    <div class="assura-grid assura-grid-cols-2" style="margin-top: 0; gap: 32px;">

      <!-- ── LEFT COLUMN: Basic Information ── -->
      <div>
        <h3 style="margin: 0 0 20px 0; font-family: 'Jost'; font-size: 16px; font-weight: 600;  text-transform: uppercase; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px;">Basic Information</h3>

        <!-- Asset Code: required unique identifier (e.g. ASSET-001).
             [class.has-error] adds a red border when showError() returns true. -->
        <div style="margin-bottom: 20px;">
          <label class="assura-label" for="assetCode">Asset Code <span style="color: #ef4444;">*</span></label>
          <div style="display: flex; gap: 8px;">
            <input id="assetCode" type="text" class="assura-input" [ngStyle]="{'border-color': showError('assetCode') ? '#ef4444' : ''}" formControlName="assetCode" placeholder="e.g. AST-20260815-1234" required />
            <button type="button" class="assura-btn assura-btn-secondary" style="padding: 0 14px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; font-size: 13px;" (click)="regenerateCode()" title="Generate new unique code">
              <mat-icon style="font-size: 18px; width: 18px; height: 18px;">autorenew</mat-icon>
              <span>Auto</span>
            </button>
          </div>
          <div style="color: #ef4444; font-size: 13px; margin-top: 4px;" *ngIf="showError('assetCode')">Asset Code is required</div>
        </div>

        <!-- Asset Tag: optional secondary label (e.g. a physical barcode sticker reference) -->
        <div style="margin-bottom: 20px;">
          <label class="assura-label" for="assetTag">Asset Tag</label>
          <input id="assetTag" type="text" class="assura-input" formControlName="assetTag" placeholder="e.g. TAG-123" />
        </div>

        <!-- Product dropdown: populated from the `products` array loaded via ProductService.
             [ngValue]="0" is the placeholder; Validators.min(1) makes 0 an invalid selection. -->
        <div style="margin-bottom: 20px;">
          <label class="assura-label" for="productId">Product <span style="color: #ef4444;">*</span></label>
          <select id="productId" class="assura-input custom-select" [ngStyle]="{'border-color': showError('productId') ? '#ef4444' : ''}" formControlName="productId" required>
            <option [ngValue]="0">Select Product</option>
            <option *ngFor="let p of products" [ngValue]="p.id">{{ p.name }}</option>
          </select>
          <div style="color: #ef4444; font-size: 13px; margin-top: 4px;" *ngIf="showError('productId')">Product is required</div>
        </div>

        <!-- Status dropdown: driven by the `statuses` string-array in the component
             (InUse, InStore, UnderMaintenance, Discarded, Transferred, Lost) -->
        <div style="margin-bottom: 20px;">
          <label class="assura-label" for="status">Status <span style="color: #ef4444;">*</span></label>
          <select id="status" class="assura-input custom-select" [ngStyle]="{'border-color': showError('status') ? '#ef4444' : ''}" formControlName="status" required>
            <option value="">Select Status</option>
            <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
          </select>
          <div style="color: #ef4444; font-size: 13px; margin-top: 4px;" *ngIf="showError('status')">Status is required</div>
        </div>
      </div>

      <!-- ── RIGHT COLUMN: Details ── -->
      <div>
        <h3 style="margin: 0 0 20px 0; font-family: 'Jost'; font-size: 16px; font-weight: 600;  text-transform: uppercase; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px;">Details</h3>

        <!-- Category: groups assets into logical types (e.g. Electronics, Furniture) -->
        <div style="margin-bottom: 20px;">
          <label class="assura-label" for="categoryId">Category <span style="color: #ef4444;">*</span></label>
          <select id="categoryId" class="assura-input custom-select" [ngStyle]="{'border-color': showError('categoryId') ? '#ef4444' : ''}" formControlName="categoryId" required>
            <option [ngValue]="0">Select Category</option>
            <option *ngFor="let c of categories" [ngValue]="c.id">{{ c.name }}</option>
          </select>
          <div style="color: #ef4444; font-size: 13px; margin-top: 4px;" *ngIf="showError('categoryId')">Category is required</div>
        </div>

        <!-- Supplier: the vendor from whom the asset was purchased -->
        <div style="margin-bottom: 20px;">
          <label class="assura-label" for="supplierId">Supplier <span style="color: #ef4444;">*</span></label>
          <select id="supplierId" class="assura-input custom-select" [ngStyle]="{'border-color': showError('supplierId') ? '#ef4444' : ''}" formControlName="supplierId" required>
            <option [ngValue]="0">Select Supplier</option>
            <option *ngFor="let s of suppliers" [ngValue]="s.id">{{ s.name }}</option>
          </select>
          <div style="color: #ef4444; font-size: 13px; margin-top: 4px;" *ngIf="showError('supplierId')">Supplier is required</div>
        </div>

        <!-- Division: the department or business unit responsible for this asset -->
        <div style="margin-bottom: 20px;">
          <label class="assura-label" for="divisionId">Division <span style="color: #ef4444;">*</span></label>
          <select id="divisionId" class="assura-input custom-select" [ngStyle]="{'border-color': showError('divisionId') ? '#ef4444' : ''}" formControlName="divisionId" required>
            <option [ngValue]="0">Select Division</option>
            <option *ngFor="let d of divisions" [ngValue]="d.id">{{ d.name }}</option>
          </select>
          <div style="color: #ef4444; font-size: 13px; margin-top: 4px;" *ngIf="showError('divisionId')">Division is required</div>
        </div>

        <!-- Serial Number: manufacturer serial for exact unit identification.
             Cleared automatically in clone mode to avoid duplicate serials. -->
        <div style="margin-bottom: 20px;">
          <label class="assura-label" for="serialNumber">Serial Number</label>
          <input id="serialNumber" type="text" class="assura-input" formControlName="serialNumber" placeholder="e.g. SN123456" />
        </div>
      </div>
    </div>

    <!-- ── Full-width Additional section (outside the two-column grid) ── -->
    <div style="margin-top: 12px; margin-bottom: 32px;">
      <h3 style="margin: 0 0 20px 0; font-family: 'Jost'; font-size: 16px; font-weight: 600;  text-transform: uppercase; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px;">Additional</h3>

      <!-- Side-by-side pair: Asset Date and Purchase Value -->
      <div class="assura-grid assura-grid-cols-2" style="margin-top: 0; gap: 24px; margin-bottom: 20px;">
        <!-- Asset Date: purchase/registration date; defaults to today via getTodayDateString() -->
        <div>
          <label class="assura-label" for="assetDate">Asset Date</label>
          <input id="assetDate" type="date" class="assura-input" [ngStyle]="{'border-color': showError('assetDate') ? '#ef4444' : ''}" formControlName="assetDate" />
          <div style="color: #ef4444; font-size: 13px; margin-top: 4px;" *ngIf="showError('assetDate')">Asset date is required</div>
        </div>

        <!-- Purchase Value: monetary amount in LKR.
             .money-row makes the currency badge and input appear as one fused control. -->
        <div>
          <label class="assura-label" for="purchaseValue">Purchase Value</label>
          <div style="display: flex; align-items: stretch;">
            <span style="  padding: 10px 16px; border: 1px solid #cbd5e1; border-right: none; border-radius: 8px 0 0 8px; font-weight: 500; font-size: 14px; display: flex; align-items: center;">LKR</span>
            <input id="purchaseValue" type="number" class="assura-input" style="border-radius: 0 8px 8px 0; flex-grow: 1;" formControlName="purchaseValue" placeholder="0" min="0" step="1" />
          </div>
        </div>
      </div>

      <!-- Notes: free-text remarks about the asset (max 1000 chars enforced in the FormGroup) -->
      <div>
        <label class="assura-label" for="notes">Notes</label>
        <textarea id="notes" class="assura-input" formControlName="notes" rows="3"
          placeholder="Additional notes about this asset..."></textarea>
      </div>
    </div>

    <!-- ── Action Buttons ── -->
    <div style="display: flex; justify-content: flex-end; gap: 12px; padding-top: 24px; border-top: 1px solid #e2e8f0;">
      <!-- Cancel: navigates back without saving -->
      <button type="button" class="assura-btn assura-btn-secondary" (click)="onCancel()">Cancel</button>

      <!-- Submit: disabled while saving or form is invalid.
           Icon swaps to a spinning 'sync' during the in-flight API call.
           Label changes contextually by mode. -->
      <button type="submit" class="assura-btn assura-btn-primary" [disabled]="saving || assetForm.invalid">
        <mat-icon style="font-size: 18px;" *ngIf="!saving">save</mat-icon>
        <mat-icon style="font-size: 18px; animation: spin 1s linear infinite;" *ngIf="saving">sync</mat-icon>
        {{ saving ? 'Saving...' : (mode === 'create' ? 'Create Asset' : mode === 'clone' ? 'Create Clone' : 'Save Changes') }}
      </button>
    </div>
  </form>
</div>

<!-- Result Overlay: covers the whole page after a save attempt.
     Auto-closes after 2 seconds; (closed) fires onResultClosed() which then navigates away. -->
<app-result-overlay *ngIf="showResult" [type]="resultType" [title]="resultTitle" [message]="resultMessage"
  (closed)="onResultClosed()"></app-result-overlay>
