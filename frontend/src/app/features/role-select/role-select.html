<div class="role-select-container">
    <div class="role-card-wrapper">
        <div class="brand">
            <img src="assets/images/LOGO2.png" alt="Assura Logo" class="brand-logo" />
            <h1>Assura</h1>
            <p>Select your role to continue</p>
        </div>

        <div class="roles">
            <div class="role-card" (click)="selectRole('superintendent')">
                <div class="role-icon superintendent-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5z" />
                        <path d="M2 17l10 5 10-5" />
                        <path d="M2 12l10 5 10-5" />
                    </svg>
                </div>
                <h2>Superintendent</h2>
                <p>Review assets, approve or reject discard requests, manage buyers</p>
                <span class="role-arrow">→</span>
            </div>

            <div class="role-card" (click)="selectRole('accountant')">
                <div class="role-icon accountant-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="3" width="20" height="18" rx="2" ry="2" />
                        <line x1="8" y1="7" x2="16" y2="7" />
                        <line x1="8" y1="11" x2="16" y2="11" />
                        <line x1="8" y1="15" x2="12" y2="15" />
                    </svg>
                </div>
                <h2>Accountant</h2>
                <p>Upload receipts, save discarded assets, view discard history</p>
                <span class="role-arrow">→</span>
            </div>
        </div>
    </div>
</div>
