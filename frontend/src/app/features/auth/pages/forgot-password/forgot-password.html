<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Assura</h2>
            <p>Forgot Password</p>
        </div>

        @if (message) {
        <div class="success-message">
            {{ message }}
        </div>
        }

        @if (errorMessage) {
        <div class="error-message">
            {{ errorMessage }}
        </div>
        }

        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="auth-form">
            <div class="form-group">
                <div class="input-wrapper">
                    <mat-icon class="input-icon">email_outline</mat-icon>
                    <input type="email" id="email" formControlName="email" class="form-control"
                        placeholder="Email Address" />
                </div>
                @if (forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid) {
                <div class="error-message">Valid email is required</div>
                }
            </div>

            <button type="submit" class="btn-primary" [disabled]="forgotForm.invalid || isLoading">
                @if (isLoading) {
                <span>Sending Reset Link...</span>
                } @else {
                <span>Request Reset Link</span>
                }
            </button>
        </form>

        <div class="auth-footer">
            <p>Remembered your password? <span routerLink="/auth/login" class="link">Login</span></p>
            <p>Already have a token? <span routerLink="/auth/reset-password" class="link">Reset Password</span></p>
        </div>
    </div>
</div>
