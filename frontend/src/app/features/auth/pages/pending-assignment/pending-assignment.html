<div class="auth-container">
    <div class="success-card">
        <mat-icon class="success-icon" style="color: #f59e0b;">hourglass_top</mat-icon>
        <h2 class="success-main">Waiting for Role Assignment</h2>
        <p class="success-sub">
            @if (firstName) {
                Hi {{ firstName }},
            }
            your account has been created but has not been assigned a role or division yet.
            An HR representative or administrator needs to complete this step before you can
            access the system. Please check back later.
        </p>
        <button type="button" class="btn-primary" style="margin-top: 24px;" (click)="logout()">Log Out</button>
    </div>
</div>
