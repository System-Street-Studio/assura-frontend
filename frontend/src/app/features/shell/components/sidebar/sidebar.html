<aside class="sidebar" [class.collapsed]="isCollapsed">
  <div class="sidebar-header">
    @if (!isCollapsed) {
    <img src="assets/images/LOGO2.png" alt="Assura Logo" class="sidebar-logo" />
    <span class="sidebar-title">Assura</span>
    }
    <button class="menu-toggle" (click)="toggleMenu()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000000"
        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>
  </div>

  <nav class="sidebar-nav">
    @for (item of menuItems; track item.label) {
    <a class="nav-item" [routerLink]="item.link" routerLinkActive="active" [title]="item.label">
      <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
      @if (!isCollapsed) {
      <span class="nav-label">{{ item.label }}</span>
      }
    </a>
    }
  </nav>
</aside>
