<aside class="sidebar" [class.collapsed]="isCollapsed">
    <div class="sidebar-header">
        <img src="assets/images/LOGO2.png" alt="Assura Logo" class="sidebar-logo" />
        <span class="sidebar-title">Assura</span>
        <button class="menu-toggle" (click)="toggleMenu()">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="6" x2="21" y2="6" />
                <line x1="3" y1="12" x2="21" y2="12" />
                <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
        </button>
    </div>

    <nav class="sidebar-nav">
        <a class="nav-item" routerLink="/superintendent/overview" routerLinkActive="active" data-tooltip="Overview">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z" />
                <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
            <span class="nav-label">Overview</span>
        </a>
        <a class="nav-item" routerLink="/superintendent/my-assets" routerLinkActive="active" data-tooltip="My Assets">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                <line x1="8" y1="8" x2="16" y2="8" />
                <line x1="8" y1="12" x2="16" y2="12" />
                <line x1="8" y1="16" x2="12" y2="16" />
            </svg>
            <span class="nav-label">My Assets</span>
        </a>
        <a class="nav-item" routerLink="/superintendent/discarded-notes" routerLinkActive="active"
            data-tooltip="Discarded Notes">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
            </svg>
            <span class="nav-label">Discarded Notes</span>
        </a>
        <a class="nav-item" routerLink="/superintendent/buyer" routerLinkActive="active" data-tooltip="Buyer">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
                <line x1="3" y1="6" x2="21" y2="6" />
                <path d="M16 10a4 4 0 0 1-8 0" />
            </svg>
            <span class="nav-label">Buyer</span>
        </a>
    </nav>
</aside>
