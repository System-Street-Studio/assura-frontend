<div class="my-assets-container">
    <div class="header-section">
        <h1 class="page-title">My Assets</h1>
    </div>

    <div class="table-card">
        <div *ngIf="loading" style="padding: 24px; text-align: center; color: #6b7280;">Loading assets...</div>
        <div *ngIf="!loading && assets.length === 0" style="padding: 24px; text-align: center; color: #6b7280;">No assets currently assigned to your account.</div>
        <app-data-table *ngIf="!loading && assets.length > 0" [columns]="columns" [data]="assets" (rowClick)="onAssetClick($event)">
        </app-data-table>
    </div>
</div>
