<div class="dashboard-container">
    <div class="header-actions">
        <h1 class="statics-title">Master Data Management</h1>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn" [class.active]="activeTab === 'divisions'" (click)="switchTab('divisions')">Divisions (Departments)</button>
        <button class="tab-btn" [class.active]="activeTab === 'categories'" (click)="switchTab('categories')">Asset Categories</button>
    </div>

    <!-- Action Bar -->
    <div class="action-bar" *ngIf="!showForm">
        <button class="btn btn-primary" (click)="openAddForm()">
            <i class="material-icons" style="vertical-align: middle; font-size: 18px; margin-right: 5px;">add</i>
            Add New {{ activeTab === 'divisions' ? 'Division' : 'Category' }}
        </button>
    </div>

    <!-- Form Section -->
    <div class="form-section" *ngIf="showForm">
        <h3 style="margin-top: 0;">{{ isEditing ? 'Edit' : 'Add' }} {{ activeTab === 'divisions' ? 'Division' : 'Category' }}</h3>
        
        <form [formGroup]="form" (ngSubmit)="submitForm()" class="master-data-form">
            <div class="form-group">
                <label>Name <span class="required">*</span></label>
                <input type="text" formControlName="name" class="form-control" placeholder="Enter name">
                <div class="error-msg" *ngIf="form.get('name')?.invalid && form.get('name')?.touched">Name is required</div>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea formControlName="description" class="form-control" placeholder="Enter description" rows="3"></textarea>
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-secondary" (click)="closeForm()">Cancel</button>
                <button type="submit" class="btn btn-success" [disabled]="form.invalid">Save</button>
            </div>
        </form>
    </div>

    <!-- Data Table Section -->
    <div class="table-container" *ngIf="!showForm">
        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th style="width: 150px; text-align: center;">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of (activeTab === 'divisions' ? divisions : categories)">
                    <td>{{ item.id }}</td>
                    <td><strong>{{ item.name }}</strong></td>
                    <td style="color: #666;">{{ item.description || '-' }}</td>
                    <td style="text-align: center;">
                        <button class="icon-btn edit-btn" (click)="openEditForm(item)" title="Edit">
                            <i class="material-icons">edit</i>
                        </button>
                        <button class="icon-btn delete-btn" (click)="deleteItem(item.id)" title="Delete">
                            <i class="material-icons">delete</i>
                        </button>
                    </td>
                </tr>
                <tr *ngIf="(activeTab === 'divisions' ? divisions : categories).length === 0">
                    <td colspan="4" class="empty-state">No data found. Click 'Add New' to create one.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
