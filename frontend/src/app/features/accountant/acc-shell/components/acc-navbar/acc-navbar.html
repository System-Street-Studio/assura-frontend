<nav class="navbar">
    <div class="navbar-left">
    </div>
    <div class="navbar-right">
        <!-- Notification Button -->
        <div class="notification-container" (click)="$event.stopPropagation()">
            <div class="notification-icon" (click)="toggleNotifications($event)" title="Notifications">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                    <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                </svg>
                <span class="badge" *ngIf="pendingItems.length > 0">{{ pendingItems.length }}</span>
            </div>

            <!-- Notifications Dropdown Popover -->
            <div class="notifications-dropdown" *ngIf="showNotifications">
                <div class="dropdown-header">
                    <h3>Pending Requests</h3>
                    <span class="count-tag">{{ pendingItems.length }} active</span>
                </div>
                <div class="dropdown-list">
                    <div class="dropdown-item" *ngFor="let item of pendingItems" (click)="selectRequest(item.id)">
                        <div class="item-header">
                            <span class="item-name">{{ item.name }}</span>
                            <span class="status-dot" [ngClass]="item.category"></span>
                        </div>
                        <div class="item-meta">
                            <span class="item-division">{{ item.division }}</span>
                            <span class="item-date">{{ item.date }}</span>
                        </div>
                    </div>
                    <div class="empty-state" *ngIf="pendingItems.length === 0">
                        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none"
                            stroke="#ccc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                            <polyline points="22 4 12 14.01 9 11.01" />
                        </svg>
                        <p>No pending requests</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Vertical Divider -->
        <div class="navbar-divider"></div>

        <!-- Role Label -->
        <span class="role-label">Accountant</span>

        <div class="profile-icon" (click)="goToRoleSelect()" title="Switch Role">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
            </svg>
        </div>
    </div>
</nav>
