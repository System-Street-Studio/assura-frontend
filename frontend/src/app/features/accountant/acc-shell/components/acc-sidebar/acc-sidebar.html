<aside class="sidebar" [class.collapsed]="isCollapsed">
    <div class="sidebar-header">
        <img src="assets/images/LOGO2.png" alt="Assura Logo" class="sidebar-logo" />
        <span class="sidebar-title">Assura</span>
        <button class="menu-toggle" (click)="toggleSidebar()">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="6" x2="21" y2="6" />
                <line x1="3" y1="12" x2="21" y2="12" />
                <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
        </button>
    </div>

    <nav class="sidebar-nav">
        <a class="nav-item" routerLink="/accountant/overview" routerLinkActive="active" data-tooltip="Overview">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z" />
                <polyline points="9 22 9 12 15 12 15 22" />

        </a>

            <span class="nav-label">My Assets</span>
        </a>
        <a class="nav-item" routerLink="/accountant/discarded" routerLinkActive="active" data-tooltip="Discarded">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
