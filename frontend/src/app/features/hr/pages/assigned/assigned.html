<div class="hr-shell">
  <section class="assigned-page" aria-labelledby="assigned-title">
    <div class="content-shell">
      <h1 id="assigned-title" class="page-title">Assigned</h1>

      <div class="glass-panel assura-table-container">
        <table class="assura-table">
          <thead>
            <tr>
              <th class="assura-th">User ID</th>
              <th class="assura-th">Name</th>
              <th class="assura-th">Role</th>
              <th class="assura-th">Division</th>
              <th class="assura-th">Joined Date</th>
              <th class="assura-th">Actions</th>
            </tr>
          </thead>

          <tbody>
            @for (user of assignedUsers(); track user.id) {
            <tr class="assura-tr-hover">
              <td class="assura-td">{{ user.userId }}</td>
              <td class="assura-td">{{ user.name }}</td>
              <td class="assura-td">{{ user.role }}</td>
              <td class="assura-td">{{ user.division }}</td>
              <td class="assura-td">{{ user.joinedDate }}</td>
              <td class="assura-td">
                <button class="assigned-edit-btn" type="button" (click)="openEditForm(user.id)">
                  <svg aria-hidden="true" viewBox="0 0 24 24" width="15" height="15">
                    <path d="M4 20h4l10.5-10.5a2.8 2.8 0 0 0-4-4L4 16v4Zm10.9-12.9 2 2" />
                  </svg>
                  Edit
                </button>
              </td>
            </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </section>
</div>
