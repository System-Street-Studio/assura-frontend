<div style="padding: 32px; max-width: 1200px; margin: 0 auto; height: 100%; overflow-y: auto;">
  
  <!-- Greeting Banner -->
  <div class="assura-greeting-banner">
    <h2 class="assura-greeting-text">{{ greeting }}, {{ firstName }}</h2>
    <p class="assura-greeting-date">{{ currentDate | date:'EEEE, MMMM d, y — h:mm a' }}</p>
  </div>

  <section aria-labelledby="statistics-title">
    <h1 id="statistics-title" class="assura-page-title">Statistics</h1>

    <div class="assura-grid assura-grid-cols-4" aria-label="Role assignment statistics">
      @for (stat of stats(); track stat.label) {
      <article class="assura-card assura-accent-info">
        <span class="assura-card-title">{{ stat.label }}</span>
        <strong class="assura-card-value">{{ stat.value }}</strong>
      </article>
      }
    </div>

    <section aria-labelledby="division-title" style="margin-top: 32px;">
      <h2 id="division-title" class="assura-page-title" style="font-size: 20px;">Users by Division</h2>
      
      <div class="assura-grid assura-grid-cols-2">
        <article class="assura-card assura-accent-primary">
          <div style="display: flex; flex-direction: column; gap: 12px;">
            @for (item of usersByDivision(); track item.division) {
            <div style="display: flex; justify-content: space-between; padding-bottom: 8px; border-bottom: 1px solid #e2e8f0;">
              <span class="assura-card-subtitle" style="margin: 0;">{{ item.division }}</span>
              <span style="font-weight: bold; font-family: 'Jost';">{{ item.users }}</span>
            </div>
            }
          </div>
        </article>
      </div>
    </section>
  </section>
</div>
